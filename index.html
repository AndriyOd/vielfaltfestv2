<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival Registration</title>

    <style>
        body {
            font-family: sans-serif;

            font-family: sans-serif;
            padding: 15px;
            /*background-color: #afd6ff88;*/
            /* Чтобы элементы не прилипали к краям экрана */
        }

        #button_NG {
            width: 100%;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            /*background-color: lightgrey;*/
        }

        /* Увеличиваем все поля ввода для удобства нажатия */
        .button {
            width: 50%;
            /* Растягиваем на всю ширину экрана */
            height: fit-content;
            padding: 15px;
            /* Делаем выше, чтобы было удобно попадать пальцем */
            font-size: 60px;
            /* Предотвращает зум при нажатии (на iOS) */
            box-sizing: border-box;
            /*display: block;*/
            text-align: center;
            margin-bottom: 10px;
            padding: 0.5em;

            /*background-color: #007bff;*/
            background-color: #358dec;
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: bold;
            text-decoration: none;
        }

        .h1_ed {
            font-size: 45px;
            text-align: center;
        }

        .teilen {
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1 class="h1_ed">Herzlich willkommen!</h1>
    <div class="teilen">Teilen Sie uns bitte mit, woher Sie kommen.</div>
    <div id="button_NG">
        <a href="mitteilen.html" class="button">+ Neuer Gast</a>
    </div>


    <br>
    <a href="mitteilen.html" style="color: #d5d4d4">mitteilen</a>
</body>

</html>
